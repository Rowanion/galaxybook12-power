# CPU package power limits in watts, applied by galaxybook-ac-power whenever
# the charger is plugged/unplugged, at boot and after resume.
#
# On AC the CPU is capped so the charger can out-supply the tablet and the
# battery actually charges. Raise AC_* if you use a strong charger and want
# full speed; lower them if the battery still drops while plugged in.
AC_PL1=7      # sustained (firmware default 15)
AC_PL2=12     # short bursts (firmware default 25)

# On battery: firmware defaults (full performance).
BAT_PL1=15
BAT_PL2=25
