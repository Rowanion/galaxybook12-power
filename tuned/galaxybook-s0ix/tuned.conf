# Applied by TuneD on top of every profile (post-loaded), including the
# automatic AC/battery switches. Without SATA DevSleep the chipset never
# reaches S0ix in s2idle: measured 0 s -> 39.2 s of 40 s on 2026-11-10.
[main]
summary=Galaxy Book: SATA link power min_power (DevSleep) so s2idle reaches S0ix

[scsi_host]
alpm=min_power
